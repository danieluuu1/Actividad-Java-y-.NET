server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: comisariato-java
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Comisariato;encrypt=true;trustServerCertificate=false;loginTimeout=10}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    edu.comisariato.api: INFO
